name: Android Preview APK (Debug Build)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Build Debug APK for Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ── Setup Node.js ──
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Setup Java 17 ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # ── Setup Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Cache Gradle dependencies ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Install npm dependencies ──
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── Expo Prebuild (generate native android/ folder) ──
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # ── Build Debug APK ──
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}-preview

      # ── Upload APK artifact ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── Success summary ──
      - name: Build Summary
        run: |
          echo "✅ DEBUG APK BUILT SUCCESSFULLY!"
          echo ""
          echo "📥 Download: Go to Actions tab → this run → Artifacts → 'preview-apk'"
          echo "📱 Install: Transfer APK to your Android phone → tap to install"
          echo "⚠️  Note: Debug build — for testing only, not for Play Store"
