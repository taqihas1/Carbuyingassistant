name: EAS Build - Self-Healing Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build Android AAB (with retry)
        id: build_aab
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 4
          retry_on: error
          command: eas build --platform android --profile production --non-interactive

      - name: Build succeeded notification
        if: success()
        run: |
          echo "✅ Android AAB build succeeded!"
          echo "Download at: https://expo.dev/accounts/${{ github.repository_owner }}/projects"

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '🔴 EAS Build Failed - Android AAB - Run #' + context.runNumber;
            const body = '## Build Failure Report\n\n' +
              'Repository: ' + context.repo.owner + '/' + context.repo.repo + '\n' +
              'Branch: ' + github.ref + '\n' +
              'Commit: ' + github.sha + '\n' +
              'Workflow Run: [View logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + github.run_id + ')' + '\n' +
              'Actor: ' + github.actor + '\n\n' +
              '### Build Details\n' +
              '- Platform: Android\n' +
              '- Profile: production (AAB)\n' +
              '- Retries: 4 attempts exhausted\n\n' +
              '### How to Fix\n' +
              '1. Check EAS build logs: https://expo.dev/accounts/' + github.repository_owner + '/projects\n' +
              '2. Review the error above in the Actions logs\n' +
              '3. Fix the issue in code\n' +
              '4. Push the fix - CI will retrigger automatically\n\n' +
              '### Auto-Retry Status\n' +
              '❌ All 4 retry attempts failed. Manual intervention required.\n\n' +
              '---\n' +
              '*This issue was auto-generated by the self-healing CI/CD pipeline.*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'android', 'auto-generated']
            });

  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build iOS IPA (with retry)
        id: build_ipa
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 4
          retry_on: error
          command: eas build --platform ios --profile production --non-interactive

      - name: Build succeeded notification
        if: success()
        run: |
          echo "✅ iOS IPA build succeeded!"

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '🔴 EAS Build Failed - iOS IPA - Run #' + context.runNumber;
            const body = '## Build Failure Report\n\n' +
              'Repository: ' + context.repo.owner + '/' + context.repo.repo + '\n' +
              'Branch: ' + github.ref + '\n' +
              'Commit: ' + github.sha + '\n' +
              'Workflow Run: [View logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + github.run_id + ')' + '\n' +
              'Actor: ' + github.actor + '\n\n' +
              '### Build Details\n' +
              '- Platform: iOS\n' +
              '- Profile: production (IPA)\n' +
              '- Retries: 4 attempts exhausted\n\n' +
              '### How to Fix\n' +
              '1. Check EAS build logs: https://expo.dev/accounts/' + github.repository_owner + '/projects\n' +
              '2. Fix the issue in code\n' +
              '3. Push the fix - CI will retrigger automatically\n\n' +
              '---\n' +
              '*Auto-generated by self-healing CI/CD pipeline.*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'ios', 'auto-generated']
            });

  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build Preview APK (with retry)
        id: build_preview
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 4
          retry_on: error
          command: eas build --platform android --profile preview --non-interactive

      - name: Build succeeded - Generate QR
        if: success()
        run: |
          echo "✅ Preview APK build succeeded!"
          echo "QR Code available at: https://expo.dev/accounts/${{ github.repository_owner }}/projects"

      - name: Create GitHub Issue on preview failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '🟡 EAS Preview Build Failed - Run #' + context.runNumber;
            const body = '## Preview Build Failure\n\n' +
              'Repository: ' + context.repo.owner + '/' + context.repo.repo + '\n' +
              'Commit: ' + github.sha + '\n' +
              'Workflow: [View logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + github.run_id + ')' + '\n\n' +
              '### Build Details\n' +
              '- Platform: Android (Preview/APK)\n' +
              '- Retries: 4 attempts exhausted\n\n' +
              '### Next Steps\n' +
              '1. Check error logs above\n' +
              '2. Fix code issue\n' +
              '3. Push fix - preview will rebuild automatically\n\n' +
              '---\n' +
              '*Auto-generated by self-healing CI/CD pipeline.*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'preview', 'auto-generated']
            });
