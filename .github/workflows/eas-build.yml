name: EAS Build - Self-Healing Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build Android AAB (with retry)
        id: build_aab
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 4
          retry_on: error
          command: eas build --platform android --profile production --non-interactive

      - name: Build succeeded notification
        if: success()
        run: |
          echo "✅ Android AAB build succeeded!"
          echo "Download at: https://expo.dev/accounts/${{ github.repository_owner }}/projects"

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `🔴 EAS Build Failed - Android AAB - Run #${{ github.run_number }}`;
            const body = `## Build Failure Report

**Repository:** ${{ github.repository }}
**Branch:** ${{ github.ref }}
**Commit:** ${{ github.sha }}
**Workflow Run:** [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
**Actor:** ${{ github.actor }}

### Build Details
- **Platform:** Android
- **Profile:** production (AAB)
- **Retries:** 4 attempts exhausted

### How to Fix
1. Check EAS build logs: https://expo.dev/accounts/${{ github.repository_owner }}/projects
2. Review the error above in the Actions logs
3. Fix the issue in code
4. Push the fix - CI will retrigger automatically

### Auto-Retry Status
❌ All 4 retry attempts failed. Manual intervention required.

---
*This issue was auto-generated by the self-healing CI/CD pipeline.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'android', 'auto-generated']
            });

  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build iOS IPA (with retry)
        id: build_ipa
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 4
          retry_on: error
          command: eas build --platform ios --profile production --non-interactive

      - name: Build succeeded notification
        if: success()
        run: |
          echo "✅ iOS IPA build succeeded!"

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `🔴 EAS Build Failed - iOS IPA - Run #${{ github.run_number }}`;
            const body = `## Build Failure Report

**Repository:** ${{ github.repository }}
**Branch:** ${{ github.ref }}
**Commit:** ${{ github.sha }}
**Workflow Run:** [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Build Details
- **Platform:** iOS
- **Profile:** production (IPA)
- **Retries:** 4 attempts exhausted

### How to Fix
1. Check EAS build logs: https://expo.dev/accounts/${{ github.repository_owner }}/projects
2. Fix the issue in code
3. Push the fix - CI will retrigger automatically

---
*Auto-generated by self-healing CI/CD pipeline.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'ios', 'auto-generated']
            });

  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build Preview APK (with retry)
        id: build_preview
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 4
          retry_on: error
          command: eas build --platform android --profile preview --non-interactive

      - name: Build succeeded - Generate QR
        if: success()
        run: |
          echo "✅ Preview APK build succeeded!"
          echo "QR Code available at: https://expo.dev/accounts/${{ github.repository_owner }}/projects"

      - name: Create GitHub Issue on preview failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `🟡 EAS Preview Build Failed - Run #${{ github.run_number }}`;
            const body = `## Preview Build Failure

**Repository:** ${{ github.repository }}
**Commit:** ${{ github.sha }}
**Workflow:** [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Build Details
- **Platform:** Android (Preview/APK)
- **Retries:** 4 attempts exhausted

### Next Steps
1. Check error logs above
2. Fix code issue
3. Push fix - preview will rebuild automatically

---
*Auto-generated by self-healing CI/CD pipeline.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'preview', 'auto-generated']
            });
