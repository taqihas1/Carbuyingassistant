workflows:
  android-release:
    name: Android Release Build
    environment:
      java: 17
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build release AAB
        script: cd android && ./gradlew :app:bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - taqihas@gmail.com
