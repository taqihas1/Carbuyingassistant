workflows:
  android-aab-build:
    name: Build Android AAB on Codemagic
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
      vars:
        CM_KEYSTORE_PASSWORD: carbuyingassistant
        CM_KEY_PASSWORD: carbuyingassistant
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Disable New Architecture
        script: |
          mkdir -p android
          echo "newArchEnabled=false" > android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties
      - name: Expo Prebuild (Old Architecture)
        script: |
          npx expo prebuild --platform android --clean --non-interactive
      - name: Fix Release Signing Config
        script: |
          sed -i "s/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g" android/app/build.gradle
          sed -i "s|storeFile file('debug.keystore')|storeFile file('release.keystore')|g" android/app/build.gradle
          sed -i "s|storePassword 'android'|storePassword System.getenv('CM_KEYSTORE_PASSWORD') ?: 'carbuyingassistant'|g" android/app/build.gradle
          sed -i "s|keyAlias 'androiddebugkey'|keyAlias 'carbuyingassistant'|g" android/app/build.gradle
          sed -i "s|keyPassword 'android'|keyPassword System.getenv('CM_KEY_PASSWORD') ?: 'carbuyingassistant'|g" android/app/build.gradle
          echo "--- Signing config patched ---"
          grep -A5 "signingConfigs" android/app/build.gradle | head -20
      - name: Build AAB
        script: |
          cd android && ./gradlew :app:bundleRelease --max-workers=1 --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
